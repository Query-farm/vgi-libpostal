# Private graders for `vgi-lint simulate` (VGI416). The worker publishes only
# task names and prompts in vgi.agent_test_tasks; the canonical solutions and
# grading options stay in this repo-root sidecar, which vgi-lint auto-discovers.
tasks:
  - name: extract-postcode
    reference_sql: "SELECT postal.main.address_postcode('781 Franklin Ave, Brooklyn, NY 11216')"
    ignore_column_names: true
  - name: extract-house-number
    reference_sql: "SELECT postal.main.address_house_number('1600 Pennsylvania Ave NW, Washington, DC 20500')"
    ignore_column_names: true
  - name: parse-city-from-map
    reference_sql: "SELECT postal.main.parse_address('1600 Pennsylvania Ave NW, Washington, DC 20500')['city']"
    ignore_column_names: true
  - name: components-road-long-format
    reference_sql: "SELECT value FROM postal.main.parse_address_components('781 Franklin Ave, Brooklyn, NY 11216') WHERE label = 'road'"
    ignore_column_names: true
  - name: count-component-labels
    reference_sql: "SELECT count(*) FROM postal.main.address_labels()"
    ignore_column_names: true
  - name: normalize-contains-expansion
    reference_sql: "SELECT list_contains(postal.main.expand_address('120 E 96th St'), '120 east 96th street')"
    ignore_column_names: true
  - name: extract-road
    reference_sql: "SELECT postal.main.address_road('781 Franklin Ave, Brooklyn, NY 11216')"
    ignore_column_names: true
  - name: extract-state
    reference_sql: "SELECT postal.main.address_state('781 Franklin Ave, Brooklyn, NY 11216')"
    ignore_column_names: true
  - name: extract-city
    reference_sql: "SELECT postal.main.address_city('1600 Pennsylvania Ave NW, Washington, DC 20500')"
    ignore_column_names: true
  - name: extract-unit
    reference_sql: "SELECT postal.main.address_unit('Apt 5B, 120 E 96th St, New York, NY 10128')"
    ignore_column_names: true
  - name: extract-country
    reference_sql: "SELECT postal.main.address_country('10 Downing St, London SW1A 2AA, United Kingdom')"
    ignore_column_names: true
  # Composed tasks: each needs two of the worker's objects (address
  # normalization across rows; the label vocabulary vs. parsed components).
  # Offline + deterministic for a given libpostal model, so exact-compare works.
  # Expected answers: 2 (the 350 5th Ave and 1600 Pennsylvania pairs; 1650 shares
  # only the postcode) and 14 (20 labels minus the 6 the three parses use).
  - name: dedupe-count-matching-pairs
    reference_sql: >-
      WITH a(id, addr) AS (VALUES
      (1, '350 5th Ave, New York, NY 10118'), (2, '350 Fifth Avenue, New York NY 10118'),
      (3, '1600 Pennsylvania Ave NW, Washington, DC 20500'), (4, '1600 Pennsylvania Avenue Northwest, Washington DC 20500'),
      (5, '1650 Pennsylvania Ave NW, Washington, DC 20500'), (6, '10 Downing St, London SW1A 2AA')),
      k AS (SELECT id, postal.main.expand_address(addr) AS forms FROM a)
      SELECT count(*) FROM k AS x JOIN k AS y ON x.id < y.id AND list_has_any(x.forms, y.forms)
    ignore_column_names: true
  - name: count-labels-absent-from-batch
    reference_sql: >-
      SELECT count(*) FROM postal.main.address_labels
      WHERE label NOT IN (SELECT unnest(map_keys(postal.main.parse_address(addr))) FROM (VALUES
      ('1600 Pennsylvania Ave NW, Washington, DC 20500'), ('350 Fifth Avenue, New York NY 10118'),
      ('Apt 5B, 120 E 96th St, New York, NY 10128')) AS t(addr))
    ignore_column_names: true
